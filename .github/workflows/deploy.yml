name: Deploy

# Static SvelteKit build, deployed to Cloudflare Pages via the org reusable workflow.
# The universe is NOT committed: CI regenerates it from the seed and refuses to deploy
# unless every hash matches data/manifest.json (byte-stability is a deploy gate), the
# engine reproduces data/results.json exactly, and the tests pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Regenerate, verify, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Regenerate the universe from the seed
        run: |
          python scripts/roll_parameters.py
          python scripts/generate_universe.py

      - name: Gate — byte-identical to the committed manifest
        run: git diff --exit-code -- data/parameters.json data/spend.csv data/manifest.json

      - name: Gate — engine and page data reproduce exactly
        run: |
          python scripts/attribute.py
          python scripts/build_site_data.py
          git diff --exit-code -- data/results.json src/lib/site.json

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Stage downloads (monthly export files + spend table)
        run: python scripts/split_export.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build

  # Project name is explicit ("campaignmath"), so the repo name never lands on *.pages.dev.
  deploy:
    name: Deploy
    needs: [build]
    uses: lailarallc/reusable-workflows/.github/workflows/pages-deploy.yml@v1
    with:
      project_name: campaignmath
      artifact_name: site
    secrets: inherit

  # Custom domain is attached (2026-11-02). Repairs go through the manual cf-domain.yml workflow.
