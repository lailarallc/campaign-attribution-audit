name: Cloudflare domain diagnose / fix

# Manual only. Finds which Cloudflare object claims campaignmath.lailarallc.com.
# mode=diagnose (default) is read-only. mode=fix removes a stale claim held by any OTHER
# object, then attaches the domain to the campaignmath Pages project and adds the CNAME.
# Prints object names, ids and statuses only — never credentials.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose or fix"
        required: true
        default: diagnose
        type: choice
        options: [diagnose, fix]

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose (and optionally fix) the domain claim
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
          DOMAIN: campaignmath.lailarallc.com
          PROJECT: campaignmath
        shell: python3 {0}
        run: |
          import json, os, urllib.request, urllib.error
          T, A, MODE, DOM, PROJ = (os.environ[k] for k in ("CF_API_TOKEN", "CF_ACCOUNT_ID", "MODE", "DOMAIN", "PROJECT"))
          B = "https://api.cloudflare.com/client/v4"

          def api(method, path, body=None):
              req = urllib.request.Request(B + path, method=method, data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + T, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      return json.load(e)
                  except Exception:
                      return {"success": False, "errors": [{"code": e.code, "message": str(e)}]}

          def errs(r):
              return [(e.get("code"), e.get("message")) for e in r.get("errors", [])]

          print("== Pages projects and their custom domains ==")
          projects, page = [], 1
          while True:
              r = api("GET", f"/accounts/{A}/pages/projects?per_page=10&page={page}")
              if not r.get("success"):
                  print("  cannot list projects:", errs(r)); break
              projects += [p["name"] for p in r["result"]]
              info = r.get("result_info") or {}
              if page >= (info.get("total_pages") or 1):
                  break
              page += 1
          holders = []
          for name in projects:
              r = api("GET", f"/accounts/{A}/pages/projects/{name}/domains")
              ds = [(d["name"], d.get("status")) for d in r.get("result", [])] if r.get("success") else errs(r)
              hit = [d for d in ds if isinstance(d, tuple) and d[0] == DOM]
              print(f"  {name}: {ds}{'   <-- CLAIMS ' + DOM if hit else ''}")
              if hit:
                  holders.append(("pages", name))
          sub = api("GET", f"/accounts/{A}/pages/projects/{PROJ}").get("result", {}).get("subdomain")
          print("  campaignmath subdomain:", sub)

          print("== Workers custom domains ==")
          r = api("GET", f"/accounts/{A}/workers/domains")
          if r.get("success"):
              for d in r["result"]:
                  mark = "   <-- CLAIMS " + DOM if d.get("hostname") == DOM else ""
                  print(f"  {d.get('hostname')} -> service={d.get('service')} id={d.get('id')}{mark}")
                  if d.get("hostname") == DOM:
                      holders.append(("worker", d.get("id")))
          else:
              print("  cannot list:", errs(r))

          print("== Zone DNS ==")
          z = api("GET", "/zones?name=lailarallc.com")
          zone = z["result"][0]["id"] if z.get("success") and z["result"] else None
          print("  zone visible:", bool(zone), "" if zone else errs(z))
          if zone:
              d = api("GET", f"/zones/{zone}/dns_records?name={DOM}")
              print("  records:", [(x["type"], x["content"], x.get("proxied")) for x in d.get("result", [])]
                    if d.get("success") else errs(d))

          print("== What the attach call says ==")
          probe = api("GET", f"/accounts/{A}/pages/projects/{PROJ}/domains/{DOM}")
          print("  GET campaignmath/domains/<domain>:", probe.get("result", {}).get("status") if probe.get("success") else errs(probe))
          print("HOLDERS:", holders or "none found among Pages projects / Workers domains")

          if MODE != "fix":
              raise SystemExit(0)
          print("== FIX ==")
          for kind, ref in holders:
              if kind == "pages" and ref != PROJ:
                  print("  remove from Pages project", ref, errs(api("DELETE", f"/accounts/{A}/pages/projects/{ref}/domains/{DOM}")) or "ok")
              elif kind == "worker":
                  print("  remove Workers domain", ref, errs(api("DELETE", f"/accounts/{A}/workers/domains/{ref}")) or "ok")
          if ("pages", PROJ) in holders:
              print("  already on campaignmath (status above); re-validating")
              r = api("PATCH", f"/accounts/{A}/pages/projects/{PROJ}/domains/{DOM}")
          else:
              r = api("POST", f"/accounts/{A}/pages/projects/{PROJ}/domains", {"name": DOM})
          print("  attach:", "ok " + str(r.get("result", {}).get("status")) if r.get("success") else errs(r))
          if zone and sub:
              have = api("GET", f"/zones/{zone}/dns_records?name={DOM}").get("result", [])
              if not have:
                  c = api("POST", f"/zones/{zone}/dns_records",
                          {"type": "CNAME", "name": "campaignmath", "content": sub, "proxied": True})
                  print("  cname:", "ok" if c.get("success") else errs(c))
